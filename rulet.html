<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Roulette Table</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        margin: 0;
        padding: 0;
        display: flex;
        height: 100vh;
      }
      .container {
        display: flex;
        flex: 1;
      }
      .roulette {
        width: 300px;
        background: #064420;
        padding: 10px;
        display: flex;
        flex-direction: column;
        align-items: center;
      }
      .number-grid {
        display: grid;
        grid-template-columns: repeat(3, 80px);
        gap: 5px;
      }
      .number {
        width: 80px;
        height: 40px;
        display: flex;
        justify-content: center;
        align-items: center;
        font-weight: bold;
        color: white;
        border-radius: 4px;
        cursor: pointer;
      }
      .number.red { background: red; }
      .number.black { background: black; }
      .number.green { background: green; grid-column: span 3; }
      .analytics {
        flex: 1;
        padding: 20px;
        background: #f4f4f4;
        overflow-y: auto;
      }
      .analytics h2 {
        margin-top: 0;
      }
      .history, .prediction {
        margin-bottom: 20px;
        padding: 10px;
        background: #fff;
        border-radius: 5px;
        box-shadow: 0 2px 5px rgba(0,0,0,0.1);
      }
      ul {
        padding-left: 20px;
      }
    </style>
</head>
<body>
<div class="container">
    <div class="roulette">
        <div class="number green" data-number="0">0</div>
        <div class="number green" data-number="00">00</div>
        <div class="number-grid" id="numberGrid"></div>
    </div>
    <div class="analytics">
        <div class="history">
            <h2>История выпадений</h2>
            <p><strong>Последние 10:</strong> <span id="last10">—</span></p>
            <ul id="historyList"></ul>
        </div>
        <div class="prediction">
            <h2>Прогноз</h2>
            <h3>По числам (топ-5):</h3>
            <ul id="predictionNumbers"></ul>
            <h3>По рядам:</h3>
            <ul id="predictionRows"></ul>
            <h3>По дюжинам:</h3>
            <ul id="predictionDozens"></ul>
        </div>
    </div>
</div>

<script>
  const numberGrid = document.getElementById('numberGrid');
  const historyList = document.getElementById('historyList');
  const last10El = document.getElementById('last10');
  const predictionNumbers = document.getElementById('predictionNumbers');
  const predictionRows = document.getElementById('predictionRows');
  const predictionDozens = document.getElementById('predictionDozens');

  const redNumbers = [1,3,5,7,9,12,14,16,18,19,21,23,25,27,30,32,34,36];
  const blackNumbers = [2,4,6,8,10,11,13,15,17,20,22,24,26,28,29,31,33,35];

  let history = [];
  let stats = {};

  // Создаем числа 1-36
  for (let i = 1; i <= 36; i++) {
    const div = document.createElement('div');
    div.classList.add('number');
    div.dataset.number = i;
    div.textContent = i;
    if (redNumbers.includes(i)) div.classList.add('red');
    else div.classList.add('black');
    div.addEventListener('click', () => selectNumber(i));
    numberGrid.appendChild(div);
  }

  document.querySelectorAll('.number.green').forEach(el => {
    el.addEventListener('click', () => selectNumber(el.dataset.number));
  });

  function selectNumber(num) {
    history.push(num);
    if (!stats[num]) stats[num] = {count: 0, prev: []};
    stats[num].count++;
    if (history.length > 1) {
      const prevNum = history[history.length - 2];
      stats[num].prev.unshift(prevNum);
      if (stats[num].prev.length > 5) stats[num].prev.pop();
    }
    renderHistory();
    renderPrediction();
  }

  function renderHistory() {
    historyList.innerHTML = '';
    Object.keys(stats).forEach(num => {
      const li = document.createElement('li');
      li.textContent = `${num}: ${stats[num].count} раз(а), после чисел: ${stats[num].prev.join(', ') || '—'}`;
      historyList.appendChild(li);
    });
    last10El.textContent = history.slice(-10).join(', ') || '—';
  }

  function renderPrediction() {
    const total = history.length;
    if (total === 0) return;

    // По числам
    const sorted = Object.entries(stats)
      .map(([num, data]) => [num, (data.count / total * 100).toFixed(1)])
      .sort((a,b) => b[1] - a[1])
      .slice(0, 5);
    predictionNumbers.innerHTML = sorted.map(([num, p]) => `<li>${num}: ${p}%</li>`).join('');

    // По рядам
    const rowCounts = [0,0,0];
    history.forEach(n => {
      if (!isNaN(n)) rowCounts[(n-1)%3]++;
    });
    predictionRows.innerHTML = rowCounts.map((c,i) => `<li>Ряд ${i+1}: ${(c/total*100).toFixed(1)}%</li>`).join('');

    // По дюжинам
    const dozenCounts = [0,0,0];
    history.forEach(n => {
      if (n >= 1 && n <= 12) dozenCounts[0]++;
      else if (n >= 13 && n <= 24) dozenCounts[1]++;
      else if (n >= 25 && n <= 36) dozenCounts[2]++;
    });
    predictionDozens.innerHTML = [1,2,3].map(i => `<li>${i}-я дюжина: ${(dozenCounts[i-1]/total*100).toFixed(1)}%</li>`).join('');
  }
</script>
</body>
</html>
